<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>متجر عُمراء | Omara Store</title>  
<meta id="metaDesc" name="description" content="عطور تُروى، لا تُقال.">

<link rel="preconnect" href="https://fonts.googleapis.com">  
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">  

<!-- OneSignal Web Push SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "3fe0707f-ffa3-48ca-9737-11425770bcc2",
      notifyButton: { enable: true },
    });
  });
</script>

<style>  
  :root{  
    --cream:#F8EACB; --cream-deep:#F1DDA6; --card:#FFFBF0; --ink:#20301C;  
    --ink-soft:#3B4A34; --gold:#A9793C; --gold-soft:#C9A96E; --line:rgba(32,48,28,.16);  
    --danger:#9B3A2E; --ok:#4C6B3E; --shadow:0 10px 30px rgba(32,48,28,.10);  
    --card-width: 180px; --product-font: 'Aref Ruqaa', serif;
  }  
  *{box-sizing:border-box;}  
  html,body{margin:0;padding:0;}  
  body{  
    background: radial-gradient(1200px 500px at 50% -10%, var(--cream-deep), transparent 60%), var(--cream);  
    color:var(--ink); font-family:'Tajawal',sans-serif; min-height:100vh;  
  }  
  h1,h2,h3,.display{font-family:'Aref Ruqaa',serif;}  
  a{color:inherit;text-decoration:none;}  
  button{font-family:inherit;cursor:pointer;}  

  #customBgLayer { position: fixed; inset:0; z-index: -2; pointer-events: none; background-size: cover; background-position: center; opacity: 0.15; mix-blend-mode: multiply; display: none; }
  #watermarkLayer { position: fixed; inset:0; z-index: -1; pointer-events: none; display: none; }
  
  header.topbar{ position:sticky; top:0; z-index:40; background:rgba(255,255,255,0.5); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }  
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; }  
  .brand-mark{font-family:'Aref Ruqaa',serif; font-size:30px; font-weight:700; color:var(--ink); line-height:1;}  
  .brand-sub{font-size:11px; color:var(--ink-soft); letter-spacing:.15em;}  
  
  nav.pillnav{display:flex; gap:6px; background:var(--card); padding:6px; border-radius:999px; box-shadow:var(--shadow); border:1px solid var(--line); overflow-x:auto;}  
  nav.pillnav button{ background:transparent; border:none; padding:9px 18px; border-radius:999px; font-size:14px; color:var(--ink-soft); font-weight:700; }  
  nav.pillnav button.active{background:var(--ink); color:var(--cream);}  
  
  .cart-btn{ background:var(--ink); color:var(--cream); border:none; border-radius:999px; padding:11px 20px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }  
  .cart-count{ background:var(--gold); color:#fff; font-size:11px; min-width:19px; height:19px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; }  

  .hero{max-width:900px; margin:40px auto 10px; text-align:center; padding:0 20px;}  
  .hero h1{font-size:55px; margin:4px 0 10px; color:var(--ink); font-family:'Aref Ruqaa', serif;}  
  .hero p{font-size:16px; color:var(--ink-soft); max-width:520px; margin:0 auto; line-height:1.8;}  
  .hero .wa{ display:inline-flex; align-items:center; gap:8px; margin-top:18px; background:var(--ink); color:var(--cream); padding:10px 24px; border-radius:999px; font-weight:700; font-size:14px; }  

  .section{max-width:1180px; margin:0 auto; padding:20px 22px 60px;}  
  .cats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 20px;}  
  .cats button{ background:var(--card); border:1px solid var(--line); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-soft); }  
  .cats button.active{background:var(--ink); color:var(--cream); border-color:var(--ink);}  

  /* تصميم الأقسام الأفقية */
  .category-group { margin-bottom: 40px; border-bottom: 1px dashed var(--line); padding-bottom: 20px; }
  .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .category-title-text { font-family: 'Aref Ruqaa', serif; font-size: 32px; font-weight: 700; color: var(--ink); margin: 0; display: flex; align-items: center; gap: 8px; }
  .category-title-text::before { content: "✦"; color: var(--gold); font-size: 20px; }
  
  .scroll-controls { display: flex; gap: 6px; }
  .scroll-btn { background: var(--card); border: 1px solid var(--line); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; }
  .scroll-btn:hover { background: var(--ink); color: var(--cream); }

  .horizontal-scroll-container { display: flex; gap: 20px; overflow-x: auto; padding: 10px 5px; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
  .horizontal-scroll-container::-webkit-scrollbar { height: 4px; }
  .horizontal-scroll-container::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 10px; }

  .card { flex: 0 0 var(--card-width); min-width: var(--card-width); scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card .imgwrap{ aspect-ratio:1/1; width:100%; position:relative; cursor:pointer; }  
  .card .imgwrap img{ width:100%; height:100%; object-fit:contain; padding:6px; transition:transform 0.3s; }  
  .card .imgwrap:hover img { transform: scale(1.06); }
  .card .name{ font-family: 'Aref Ruqaa', serif; font-size: 26px; margin: 8px 0 4px; color: var(--ink); }  
  .price-row{ display:flex; align-items:center; justify-content:center; gap:6px; font-weight:900; font-size:16px; }  
  .addbtn{ margin-top:8px; width:100%; background:var(--ink); color:var(--cream); border:none; padding:10px; border-radius:10px; font-weight:700; font-size:13px; }  

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:10px 20px; border-radius:999px; font-size:13px; font-weight:700; z-index:200; opacity:0; transition:.3s; pointer-events:none;}  
  .toast.show{opacity:1; bottom:30px;}  
  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft); width:100%;}  
  footer{border-top:1px solid var(--line); padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}  
</style>  
</head>  
<body>  

<div id="storeView">  
  <header class="topbar">  
    <div class="topbar-inner">  
      <div>  
        <span class="brand-mark">عُمراء</span>  
        <span class="brand-sub">OMARA STORE</span>  
      </div>  
      <nav class="pillnav" id="mainNav">  
        <button class="active" onclick="scrollToSection('shop')">المتجر</button>  
        <button onclick="scrollToSection('about')">من نحن</button>  
      </nav>  
      <button class="cart-btn" onclick="toast('السلة جاهزة')">🛍️ السلة <span class="cart-count" id="cartCount">0</span></button>  
    </div>  
  </header>  
  
  <section class="hero">  
    <div style="color:var(--gold); font-weight:700;">متجر عُمراء</div>  
    <h1 id="storeSloganTitle">عطور تُروى، لا تُقال</h1>  
    <p id="storeSloganDesc">تشكيلة عطور فاخرة مختارة بعناية. كل قطعة في متجرنا تُختار لتبقى.</p>  
    <a class="wa" id="waLink" href="#" target="_blank">تواصل عبر واتساب</a>  
  </section>  
  
  <section class="section" id="shop">  
    <div class="cats" id="catFilters"></div>  
    <div id="productGrid"><div class="empty">جارِ تحميل المتجر…</div></div>  
  </section>  

  <section class="section" id="about" style="text-align:center;">  
    <h2>قصة عُمراء</h2>  
    <p style="color:var(--ink-soft); line-height:1.8;">متجر عُمراء برئاسة عامر الشعيبي، وجهتك للعطور الفاخرة والمنتجات المختارة بعناية.</p>  
  </section> 

  <footer>متجر عُمراء © 2026 — جميع الحقوق محفوظة</footer>  
</div>  

<div class="toast" id="toast"></div>  

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>  
const SUPABASE_URL = "https://vhnvjcioxmacfsogmrka.supabase.co";  
const SUPABASE_ANON_KEY = "sb_publishable_oqvyjt2eMRXeLKS-u7ahpQ_EhmoZR2t";  
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let products = [];  
let generalSettings = {};  
let activeCategory = 'الكل';  

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }  

function scrollCategory(catId, direction) {
  const container = document.getElementById('scroll-container-' + catId);
  if(container) container.scrollBy({ left: direction === 'left' ? -260 : 260, behavior: 'smooth' });
}

async function fetchProducts() {
  const { data } = await client.from('products').select('*').order('created_at', { ascending: false });
  if (data) { products = data; renderCategories(); renderProducts(); }
}

async function fetchSettings() {
  const { data } = await client.from('settings').select('*');
  if (data) {
    const genDoc = data.find(d => d.id === 'general');
    if (genDoc && genDoc.data) {
      generalSettings = genDoc.data;
      // تصفية الأقسام القديمة تلقائياً من الإعدادات
      if(generalSettings.categories) {
        generalSettings.categories = generalSettings.categories.filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');
      }
      document.getElementById('waLink').href = 'https://wa.me/' + (generalSettings.whatsapp || '96777881748');  
      renderCategories(); renderProducts();
    }
  }
}

fetchProducts(); fetchSettings();

function renderCategories(){  
  let cats = generalSettings.categories || [];
  cats = cats.filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');
  const box = document.getElementById('catFilters');  
  box.innerHTML = ['الكل', ...cats].map(c=>`<button class="${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('');  
}  

function setCategory(c){ activeCategory = c; renderCategories(); renderProducts(); }  

function buildCardHTML(p) {
    const price = Number(p.price||0);  
    const img = (p.images && p.images[0]) || '';  
    const currency = p.currency || 'ر.ي';

    return `  
    <div class="card">  
      <div class="imgwrap">  
        ${img?`<img src="${img}" alt="${p.name}">`:''}  
      </div>  
      <div class="body">  
        <p class="name">${p.name||''}</p>  
        <div class="price-row"><span class="price">${price.toFixed(2)} ${currency}</span></div>  
        <button class="addbtn" onclick="toast('أُضيف إلى السلة')">أضف للسلة</button>  
      </div>  
    </div>`;
}

function renderProducts(){  
  const container = document.getElementById('productGrid');  
  if(!products.length){ container.innerHTML = '<div class="empty">لا توجد منتجات حالياً.</div>'; return; }  

  // فلترة جراحية: إزالة الأقسام القديمة من العرض كلياً
  let validCategories = (generalSettings.categories || []).filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');
  
  // إضافة أي قسم جديد موجود بالمنتجات
  const productCats = [...new Set(products.map(p => p.category).filter(Boolean))].filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');
  const allCategories = [...new Set([...validCategories, ...productCats])];

  if(activeCategory !== 'الكل') {
      const catList = products.filter(p => p.category === activeCategory);
      if(!catList.length) { container.innerHTML = '<div class="empty">لا توجد منتجات في هذا القسم.</div>'; return; }
      const safeId = activeCategory.replace(/[^a-zA-Z0-9]/g, '_');
      container.innerHTML = `
        <div class="category-group">
          <div class="category-header">
             <h3 class="category-title-text">${activeCategory}</h3>
             <div class="scroll-controls">
                <button class="scroll-btn" onclick="scrollCategory('${safeId}', 'right')">❯</button>
                <button class="scroll-btn" onclick="scrollCategory('${safeId}', 'left')">❮</button>
             </div>
          </div>
          <div class="horizontal-scroll-container" id="scroll-container-${safeId}">
             ${catList.map(p => buildCardHTML(p)).join('')}
          </div>
        </div>`;
      return;
  }

  let fullHTML = '';
  allCategories.forEach((catName) => {
      const catProducts = products.filter(p => p.category === catName);
      if(catProducts.length > 0) {
          const safeId = catName.replace(/[^a-zA-Z0-9]/g, '_');
          fullHTML += `
            <div class="category-group">
              <div class="category-header">
                 <h3 class="category-title-text">${catName}</h3>
                 <div class="scroll-controls">
                    <button class="scroll-btn" onclick="scrollCategory('${safeId}', 'right')">❯</button>
                    <button class="scroll-btn" onclick="scrollCategory('${safeId}', 'left')">❮</button>
                 </div>
              </div>
              <div class="horizontal-scroll-container" id="scroll-container-${safeId}">
                 ${catProducts.map(p => buildCardHTML(p)).join('')}
              </div>
            </div>`;
      }
  });

  container.innerHTML = fullHTML || '<div class="empty">اضف منتجات جديدة من لوحة التحكم بالتصنيف الذي تريده (إبراق، دخوني).</div>';
}  

function scrollToSection(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
</script>  
</body>  
</html>
