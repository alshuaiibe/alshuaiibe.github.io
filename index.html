<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>متجر عُمراء | Omara Store</title>

<meta property="og:description" content="عطور تُروى، لا تُقال. تشكيلة عطور ومنتجات مختارة بعناية.">

<style>
:root{
  --cream:#F8EACB;
  --cream-deep:#F1DDA6;
  --card:#FFFBF0;
  --ink:#20301C;
  --ink-soft:#3B4A34;
  --gold:#A9793C;
  --gold-soft:#C9A96E;
  --line:rgba(32,48,28,.16);
  --danger:#9B3A2E;
  --ok:#4C6B3E;
  --shadow:0 10px 30px rgba(32,48,28,.10);
  --card-width:180px;
  --product-font:'Aref Ruqaa',serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(
      1200px 500px at 50% -10%,
      var(--cream-deep),
      transparent 60%
    ),
    var(--cream);

  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  transition:background .3s;
}

img,
video{
  max-width:100%;
}

h1,
h2,
h3,
.display{
  font-family:'Aref Ruqaa',serif;
}

.eyebrow{
  font-family:'Markazi Text',serif;
  letter-spacing:.04em;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

::selection{
  background:var(--gold-soft);
  color:var(--ink);
}

#customBgLayer{
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  opacity:.15;
  mix-blend-mode:multiply;
  display:none;
}

#watermarkLayer{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  animation:wmMove 30s linear infinite;
  display:none;
}

@keyframes wmMove{
  0%{
    background-position:0 0;
  }

  100%{
    background-position:400px 400px;
  }
}

.sunrise{
  width:100%;
  display:flex;
  justify-content:center;
  margin:6px 0;
}

.sunrise svg{
  width:260px;
  max-width:70vw;
  opacity:.75;
}

.sunrise svg path,
.sunrise svg circle{
  stroke:var(--ink);
  fill:none;
}

.sunrise svg circle{
  fill:var(--ink);
}

header.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.topbar-inner{
  max-width:1180px;
  width:100%;
  margin:0 auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  font-family:'Aref Ruqaa',serif;
  font-size:30px;
  font-weight:700;
  color:var(--ink);
  line-height:1;
}

.brand-sub{
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.15em;
}

nav.pillnav{
  display:flex;
  gap:6px;
  background:var(--card);
  padding:6px;
  border-radius:999px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
}

nav.pillnav::-webkit-scrollbar{
  display:none;
}

nav.pillnav button{
  background:transparent;
  border:none;
  padding:9px 18px;
  border-radius:999px;
  font-size:14px;
  color:var(--ink-soft);
  font-weight:700;
  transition:.2s;
  flex:0 0 auto;
}

nav.pillnav button.active,
nav.pillnav button:hover{
  background:var(--ink);
  color:var(--cream);
}

.cart-btn{
  position:relative;
  background:var(--ink);
  color:var(--cream);
  border:none;
  border-radius:999px;
  padding:11px 20px;
  font-weight:700;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:var(--shadow);
  white-space:nowrap;
}

.cart-count{
  background:var(--gold);
  color:#fff;
  font-size:11px;
  min-width:19px;
  height:19px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}

.notification-bell{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:.2s;
  box-shadow:var(--shadow);
  font-size:18px;
  flex:0 0 auto;
}

.notification-bell:hover{
  background:var(--card);
  transform:translateY(-2px);
}

.notification-dot{
  position:absolute;
  top:0;
  right:0;
  background:var(--danger);
  width:12px;
  height:12px;
  border-radius:50%;
  border:2px solid var(--cream);
  display:none;
}

.notification-dot.active{
  display:block;
}

.notifications-dropdown{
  position:absolute;
  top:50px;
  left:0;
  width:320px;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  border:1px solid var(--line);
  padding:16px;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  max-height:400px;
  overflow-y:auto;
  text-align:right;
}

.notifications-dropdown.show{
  opacity:1;
  pointer-events:auto;
}

.notif-item{
  padding:12px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:.2s;
}

.notif-item:last-child{
  border-bottom:none;
}

.notif-item img{
  width:50px;
  height:50px;
  border-radius:8px;
  object-fit:cover;
}

.notif-text{
  font-size:13px;
  line-height:1.5;
}

.notif-time{
  font-size:11px;
  color:var(--ink-soft);
  margin-top:4px;
}

.hero{
  max-width:900px;
  width:100%;
  margin:50px auto 10px;
  text-align:center;
  padding:0 20px;
}

.hero .eyebrow{
  font-size:19px;
  color:var(--gold);
  margin-bottom:6px;
}

.hero h1{
  font-size:64px;
  margin:4px 0 10px;
  color:var(--ink);
}

.hero p{
  font-size:16px;
  color:var(--ink-soft);
  max-width:520px;
  margin:0 auto;
  line-height:1.9;
  white-space:pre-line;
}

.hero .wa{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:22px;
  background:var(--ink);
  color:var(--cream);
  padding:12px 26px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  box-shadow:var(--shadow);
}

#productGrid{
  width:100%;
}

.product-rows-container{
  display:flex;
  flex-direction:column;
  gap:40px;
  width:100%;
  min-width:0;
}

.category-row{
  width:100%;
  min-width:0;
}

.category-title{
  font-size:34px;
  margin:0 0 16px;
  padding-bottom:8px;
  color:var(--ink);
}

.horizontal-scroll{
  display:flex;
  gap:22px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 2px 20px;
  scroll-snap-type:x proximity;
  direction:rtl;
  width:100%;
  max-width:100%;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
}

.horizontal-scroll::-webkit-scrollbar{
  height:8px;
}

.horizontal-scroll::-webkit-scrollbar-thumb{
  background:var(--line);
  border-radius:10px;
}

.card{
  background:transparent;
  border:none;
  box-shadow:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;

  flex:0 0 var(--card-width);
  width:var(--card-width);
  max-width:var(--card-width);

  scroll-snap-align:start;
}

.card .imgwrap{
  aspect-ratio:1/1;
  background:transparent;
  position:relative;
  overflow:visible;
  width:100%;
  cursor:pointer;
}

.card .imgwrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:10px;
  transition:transform .4s ease;
}

.card .imgwrap:hover img{
  transform:scale(1.08);
}

.card .body{
  padding:12px 0;
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}

.card .name{
  font-family:var(--product-font);
  font-size:24px;
  margin:0;
  overflow-wrap:anywhere;
}

.price-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
}

.price{
  font-weight:900;
  font-size:18px;
  color:var(--ink);
  direction:ltr;
}

.price-old{
  font-size:13px;
  color:var(--ink-soft);
  text-decoration:line-through;
  opacity:.7;
}

.addbtn{
  margin-top:6px;
  width:100%;
  background:var(--ink);
  color:var(--cream);
  border:none;
  padding:11px;
  border-radius:12px;
  font-weight:700;
  font-size:14px;
}

.addbtn:disabled{
  background:var(--line);
  color:var(--ink-soft);
}

.fav-btn{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  background:rgba(255,255,255,.8);
  border:none;
  border-radius:50%;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.badge-discount{
  position:absolute;
  top:10px;
  right:10px;
  background:var(--danger);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
}

.badge-out{
  position:absolute;
  inset:0;
  background:rgba(32,48,28,.55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  border-radius:20px;
}

.section{
  max-width:1180px;
  width:100%;
  margin:0 auto;
  padding:36px 22px 70px;
}

.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:10px;
}

.section-head h2{
  font-size:34px;
  margin:0;
}

.cats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.cats button{
  background:var(--card);
  border:1px solid var(--line);
  padding:8px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  color:var(--ink-soft);
}

.cats button.active{
  background:var(--ink);
  color:var(--cream);
}

.tools-row{
  display:none;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:26px;
}

.tools-row input,
.tools-row select{
  background:var(--card);
  border:1px solid var(--line);
  padding:10px 16px;
  border-radius:999px;
  font-size:14px;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
  width:100%;
}

.reviews-slider{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding-bottom:16px;
  scroll-snap-type:x mandatory;
}

.review-card{
  min-width:280px;
  max-width:320px;
  background:var(--card);
  border:1px solid var(--line);
  padding:20px;
  border-radius:16px;
  scroll-snap-align:start;
  box-shadow:var(--shadow);
}

footer{
  border-top:1px solid var(--line);
  padding:36px 22px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13px;
}

.social-links{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:20px;
  flex-wrap:wrap;
}

.social-links a{
  width:40px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
}

.scrim{
  position:fixed;
  inset:0;
  background:rgba(20,26,16,.55);
  backdrop-filter:blur(3px);
  z-index:80;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.scrim.show{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(420px,92vw);
  background:var(--card);
  z-index:90;
  transform:translateX(-100%);
  transition:.3s ease;
  display:flex;
  flex-direction:column;
}

.drawer.show{
  transform:translateX(0);
}

.product-modal,
.modal{
  max-width:94vw;
}

.btn{
  background:var(--ink);
  color:var(--cream);
  border:none;
  padding:13px;
  border-radius:12px;
  font-weight:700;
  font-size:15px;
  width:100%;
}

.btn.secondary{
  background:transparent;
  border:1px solid var(--ink);
  color:var(--ink);
}

input,
textarea,
select{
  max-width:100%;
}

/* =========================
   تحسين الجوال
========================= */

@media(max-width:768px){

  .topbar-inner{
    padding:10px 12px;
    gap:8px;
    flex-wrap:wrap;
  }

  .brand{
    flex:1;
  }

  .brand-mark{
    font-size:25px;
  }

  .brand-sub{
    font-size:9px;
  }

  .cart-btn{
    padding:10px 13px;
    font-size:12px;
  }

  .notification-bell{
    width:38px;
    height:38px;
  }

  nav.pillnav{
    order:3;
    width:100%;
    justify-content:flex-start;
    margin-top:4px;
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0 0 4px;
    gap:8px;
    flex-wrap:nowrap;
  }

  nav.pillnav button{
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:8px 13px;
    font-size:12px;
  }

  .notifications-dropdown{
    position:fixed;
    top:70px;
    right:10px;
    left:10px;
    width:auto;
    max-height:60vh;
  }

  .hero{
    margin-top:28px;
    padding:0 15px;
  }

  .hero h1{
    font-size:clamp(36px,11vw,52px);
    line-height:1.25;
  }

  .hero p{
    font-size:14px;
  }

  .section{
    padding:28px 12px 50px;
  }

  .section-head h2,
  .category-title{
    font-size:27px;
  }

  .horizontal-scroll{
    gap:12px;
    padding:4px 2px 18px;
  }

  .card{
    flex:0 0 min(var(--card-width),44vw) !important;
    width:min(var(--card-width),44vw) !important;
    max-width:44vw !important;
  }

  .card .name{
    font-size:20px;
    line-height:1.35;
  }

  .price{
    font-size:15px;
  }

  .price-old{
    font-size:11px;
  }

  .addbtn{
    font-size:12px;
    padding:10px 6px;
  }

  .fav-btn{
    width:30px;
    height:30px;
    font-size:15px;
    top:5px;
    left:5px;
  }

  .badge-discount{
    top:5px;
    right:5px;
    font-size:10px;
    padding:3px 7px;
  }

  .product-modal{
    width:94vw;
    max-height:92vh;
  }

  .drawer{
    width:92vw;
  }

  .review-card{
    min-width:82vw;
  }
}

@media(max-width:420px){

  .brand-sub{
    display:none;
  }

  .brand-mark{
    font-size:24px;
  }

  .cart-btn{
    padding:9px 11px;
  }

  .hero h1{
    font-size:38px;
  }

  .card{
    flex:0 0 43vw !important;
    width:43vw !important;
    max-width:43vw !important;
  }

  .card .imgwrap img{
    padding:5px;
  }

  .card .name{
    font-size:18px;
  }

  .price{
    font-size:14px;
  }
}
</style>
</head>
