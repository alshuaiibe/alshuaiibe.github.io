<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>لوحة التحكم | متجر عُمراء</title>  
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">  
<style>  
  :root{ --cream:#F8EACB; --card:#FFFBF0; --ink:#20301C; --gold:#A9793C; --danger:#9B3A2E; --line:rgba(32,48,28,.16); }  
  *{box-sizing:border-box;} body{ background: var(--cream); color:var(--ink); font-family:'Tajawal',sans-serif; margin:0; }  
  .btn{background:var(--ink); color:var(--cream); border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer;}  
  .btn.small{padding:6px 12px; font-size:12px;}  
  .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:320px; background:var(--card); padding:20px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }  
  #adminView{display:none; max-width:1000px; margin:0 auto; padding:20px;}  
  .form-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px;}  
  input, select, textarea{ width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin-top:4px; margin-bottom:12px; }  
  .admin-cat-pill { background:var(--cream); border:1px solid var(--gold); padding:6px 12px; border-radius:999px; font-size:13px; display:inline-flex; align-items:center; gap:8px; margin:4px; }  
  .admin-cat-pill button { background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold; }  
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; opacity:0; transition:.3s;}  
  .toast.show{opacity:1;}  
</style>  
</head>  
<body>  

<div class="modal" id="loginModal">  
  <h3 style="margin-top:0;">دخول لوحة التحكم</h3>  
  <input type="password" id="loginPass" placeholder="كلمة المرور">  
  <button class="btn" style="width:100%;" onclick="adminLogin()">دخول</button>  
</div>  

<div id="adminView">  
  <h2>إدارة متجر عُمراء</h2>  
  
  <div class="form-card">  
    <h3>إضافة منتج جديد</h3>  
    <label>اسم المنتج</label><input type="text" id="pfName">  
    <label>القسم / سطر العرض (مثال: إبراق، دخوني)</label>  
    <select id="pfCategory"></select>  
    <label>السعر (بالريال اليمني أو السعودي)</label><input type="number" id="pfPrice">  
    <label>رابط الصورة المباشر</label><input type="text" id="pfImg" placeholder="https://...">  
    <button class="btn" onclick="saveProduct()">حفظ المنتج ونشره</button>  
  </div>  

  <div class="form-card">  
    <h3>إدارة الأقسام (أسطر العرض)</h3>  
    <div style="display:flex; gap:8px;">  
      <input type="text" id="newCatInput" placeholder="اسم القسم الجديد (مثال: إبراق)..." style="margin:0;">  
      <button class="btn small" onclick="addNewCategory()">إضافة</button>  
    </div>  
    <div id="adminCatList" style="margin-top:12px;"></div>  
  </div>  
</div>  

<div class="toast" id="toast"></div>  

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>  
const SUPABASE_URL = "https://vhnvjcioxmacfsogmrka.supabase.co";  
const SUPABASE_ANON_KEY = "sb_publishable_oqvyjt2eMRXeLKS-u7ahpQ_EhmoZR2t";  
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  

let products = [];  
let generalSettings = { categories: ['إبراق', 'دخوني'] };  

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }  

async function adminLogin(){  
  const pass = document.getElementById('loginPass').value;  
  const { data } = await client.from('settings').select('data').eq('id', 'admin').single();  
  if(data && data.data && data.data.password === pass){  
    document.getElementById('loginModal').style.display='none';  
    document.getElementById('adminView').style.display='block';  
    fetchSettings();  
  } else { alert('كلمة المرور غير صحيحة'); }  
}  

async function fetchSettings() {  
  const { data } = await client.from('settings').select('*');  
  if (data) {  
    const genDoc = data.find(d => d.id === 'general');  
    if (genDoc && genDoc.data) {  
      generalSettings = genDoc.data;  
      // مسح الفئات القديمة نهائياً
      generalSettings.categories = (generalSettings.categories || []).filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');  
      if(!generalSettings.categories.includes('إبراق')) generalSettings.categories.push('إبراق');  
      if(!generalSettings.categories.includes('دخوني')) generalSettings.categories.push('دخوني');  
      renderCatList();  
    }  
  }  
}  

function renderCatList() {  
  const list = document.getElementById('adminCatList');  
  list.innerHTML = generalSettings.categories.map((c, i) => `  
    <div class="admin-cat-pill">  
      <span>${c}</span>  
      <button onclick="removeCat(${i})">✕</button>  
    </div>  
  `).join('');  
  
  const select = document.getElementById('pfCategory');  
  select.innerHTML = generalSettings.categories.map(c => `<option value="${c}">${c}</option>`).join('');  
}  

async function addNewCategory() {  
  const val = document.getElementById('newCatInput').value.trim();  
  if(val && !generalSettings.categories.includes(val)){  
    generalSettings.categories.push(val);  
    await client.from('settings').update({ data: generalSettings }).eq('id', 'general');  
    renderCatList();  
    toast('تمت إضافة القسم وحفظه!');  
    document.getElementById('newCatInput').value = '';  
  }  
}  

async function removeCat(index) {  
  generalSettings.categories.splice(index, 1);  
  await client.from('settings').update({ data: generalSettings }).eq('id', 'general');  
  renderCatList();  
  toast('تم الحذف بنجاح!');  
}  

async function saveProduct(){  
  const name = document.getElementById('pfName').value.trim();  
  const price = Number(document.getElementById('pfPrice').value);  
  const category = document.getElementById('pfCategory').value;  
  const img = document.getElementById('pfImg').value.trim();  
  
  if(!name || !price){ toast('يرجى إدخال اسم وسعر المنتج'); return; }  
  
  await client.from('products').insert([{ name, price, category, images: [img] }]);  
  toast('تم نشر المنتج بنجاح!');  
  document.getElementById('pfName').value = ''; document.getElementById('pfPrice').value = '';  
}  
</script>  
</body>  
</html>
