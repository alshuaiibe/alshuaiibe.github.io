<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>لوحة التحكم | متجر عُمراء</title>  
<link rel="preconnect" href="https://fonts.googleapis.com">  
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">  
<style>  
  :root{  
    --cream:#F8EACB; --cream-deep:#F1DDA6; --card:#FFFBF0; --ink:#20301C;  
    --ink-soft:#3B4A34; --gold:#A9793C; --gold-soft:#C9A96E; --line:rgba(32,48,28,.16);  
    --danger:#9B3A2E; --ok:#4C6B3E; --shadow:0 10px 30px rgba(32,48,28,.10);  
  }  
  *{box-sizing:border-box;}  
  html,body{margin:0;padding:0;}  
  body{ background: var(--cream); color:var(--ink); font-family:'Tajawal',sans-serif; min-height:100vh; }  
  .btn{background:var(--ink); color:var(--cream); border:none; padding:13px; border-radius:12px; font-weight:700; font-size:15px; width:100%; cursor:pointer;}  
  .btn.secondary{background:transparent; border:1px solid var(--ink); color:var(--ink);}  
  .btn.danger{background:var(--danger); color:#fff;}  
  .btn.small{padding:8px 14px; font-size:13px; width:auto;}  
  .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:320px; background:var(--card); padding:26px; border-radius:20px; box-shadow:var(--shadow); z-index:95; }  
  .scrim{position:fixed; inset:0; background:rgba(20,26,16,.55); z-index:90; display:none;}  
  #adminView{display:none; max-width:1100px; margin:0 auto; padding:20px;}  
  .form-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:20px;}  
  input, select, textarea{ width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit; margin-top:5px; margin-bottom:12px; }  
  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden;}  
  th,td{padding:12px; text-align:right; border-bottom:1px solid var(--line); font-size:13px;}  
  th{background:var(--cream-deep); font-weight:800;}  
  .tbl-img{width:42px; height:42px; object-fit:cover; border-radius:8px;}  
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 24px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; transition:.3s; z-index:999;}  
  .toast.show{opacity:1;}  
  .admin-cat-pill { background:var(--cream); border:1px solid var(--gold); padding:6px 12px; border-radius:999px; font-size:13px; display:inline-flex; align-items:center; gap:8px; margin:4px; }  
  .admin-cat-pill button { background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold; }  
</style>  
</head>  
<body>  

<div class="scrim" id="loginScrim" style="display:block;"></div>  
<div class="modal" id="loginModal">  
  <h3 style="margin-top:0; text-align:center;">دخول لوحة التحكم</h3>  
  <label>كلمة المرور</label>  
  <input type="password" id="loginPass" onkeydown="if(event.key==='Enter')adminLogin()">  
  <button class="btn" onclick="adminLogin()">دخول</button>  
</div>  

<div id="adminView">  
  <h2 style="font-family:'Aref Ruqaa',serif;">لوحة تحكم متجر عُمراء</h2>  
  
  <div class="form-card">  
    <h3 id="pfTitle" style="margin-top:0;">إضافة أو تعديل منتج</h3>  
    <input type="hidden" id="pfId">  
    <label>اسم المنتج</label><input type="text" id="pfName">  
    <label>القسم / سطر العرض</label><select id="pfCategory"></select>  
    <label>السعر</label><input type="number" step="0.01" id="pfPrice">  
    <label>رابط الصورة المباشر</label><input type="text" id="pfImg" placeholder="https://...">  
    <div style="display:flex; gap:10px;">  
      <button class="btn" onclick="saveProduct()">حفظ المنتج</button>  
      <button class="btn secondary" onclick="resetForm()">إلغاء</button>  
    </div>  
  </div>  

  <div class="form-card">  
    <h3>إدارة الأقسام (أسطر العرض)</h3>  
    <div style="display:flex; gap:8px;">  
      <input type="text" id="newCatInput" placeholder="اسم القسم الجديد (مثل: إبراق، دخوني)..." style="margin:0;">  
      <button class="btn small" onclick="addNewCategory()" style="width:120px;">إضافة قسم</button>  
    </div>  
    <div id="adminCatList" style="margin-top:12px;"></div>  
  </div>  

  <div class="form-card">  
    <h3>قائمة المنتجات الحالية</h3>  
    <table>  
      <thead><tr><th>صورة</th><th>الاسم</th><th>القسم</th><th>السعر</th><th>إجراءات</th></tr></thead>  
      <tbody id="productRows"></tbody>  
    </table>  
  </div>  
</div>  

<div class="toast" id="toast"></div>  

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>  
const SUPABASE_URL = "https://vhnvjcioxmacfsogmrka.supabase.co";  
const SUPABASE_ANON_KEY = "sb_publishable_oqvyjt2eMRXeLKS-u7ahpQ_EhmoZR2t";  
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  

let products = [];  
let generalSettings = { categories: ['إبراق', 'دخوني'] };  

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }  

async function adminLogin(){  
  const pass = document.getElementById('loginPass').value;  
  const { data, error } = await client.from('settings').select('data').eq('id', 'admin').single();  
  if(!error && data && data.data && data.data.password === pass){  
    document.getElementById('loginModal').style.display='none';  
    document.getElementById('loginScrim').style.display='none';  
    document.getElementById('adminView').style.display='block';  
    fetchData();  
  } else { alert('كلمة المرور غير صحيحة'); }  
}  

async function fetchData() {  
  // جلب الإعدادات والأقسام
  const { data: setっぱ } = await client.from('settings').select('*');  
  if (setっぱ) {  
    const genDoc = setっぱ.find(d => d.id === 'general');  
    if (genDoc && genDoc.data) {  
      generalSettings = genDoc.data;  
      // تنظيف نهائي لأي قسم تالف أو "عطور فاخرة"
      if(generalSettings.categories) {
          generalSettings.categories = generalSettings.categories.filter(c => c !== 'عطور فاخرة' && c !== 'منتجات أخرى' && c !== 'عطور فاخره');
      }
      if(!generalSettings.categories || generalSettings.categories.length === 0) {
          generalSettings.categories = ['إبراق', 'دخوني'];
      }
    }  
  }  
  renderCategoriesUI();  

  // جلب المنتجات
  const { data: prodData } = await client.from('products').select('*').order('created_at', { ascending: false });  
  if(prodData) {  
    products = prodData;  
    renderProductsTable();  
  }  
}  

function renderCategories() {  
  const select = document.getElementById('pfCategory');  
  select.innerHTML = (generalSettings.categories || []).map(c => `<option value="${c}">${c}</option>`).join('');  
}  

function renderCatList() {  
  const list = document.getElementById('adminCatList');  
  list.innerHTML = (generalSettings.categories || []).map((c, i) => `  
    <div class="admin-cat-pill">  
      <span>${c}</span>  
      <button onclick="removeCat(${i})">✕</button>  
    </div>  
  `).join('');  
  renderCategories();  
}  

function renderCategoriesUI() {
    renderCatList();
}

async function addNewCategory() {  
  const val = document.getElementById('newCatInput').value.trim();  
  if(val && val !== 'عطور فاخرة' && !generalSettings.categories.includes(val)){  
    generalSettings.categories.push(val);  
    const { error } = await client.from('settings').update({ data: generalSettings }).eq('id', 'general');  
    if(!error) {
        renderCatList();  
        toast('تم إضافة القسم وحفظه بنجاح!');  
        document.getElementById('newCatInput').value = '';  
    } else {
        alert('خطأ في الحفظ: ' + error.message);
    }
  }  
}  

async function removeCat(index) {  
  generalSettings.categories.splice(index, 1);  
  await client.from('settings').update({ data: generalSettings }).eq('id', 'general');  
  renderCatList();  
  toast('تم حذف القسم بنجاح!');  
}  

function renderProductsTable() {  
  const tbody = document.getElementById('productRows');  
  tbody.innerHTML = products.map(p => `  
    <tr>  
      <td>${p.images && p.images[0] ? `<img class="tbl-img" src="${p.images[0]}">` : '—'}</td>  
      <td>${p.name}</td>  
      <td><b>${p.category || '—'}</b></td>  
      <td style="direction:ltr;">${Number(p.price||0).toFixed(2)} ${p.currency || 'ر.ي'}</td>  
      <td>  
        <button class="btn small secondary" onclick="editProduct('${p.id}')">تعديل</button>  
        <button class="btn small danger" onclick="deleteProduct('${p.id}')">حذف</button>  
      </td>  
    </tr>  
  `).join('') || '<tr><td colspan="5" style="text-align:center;">لا توجد منتجات مسجلة</td></tr>';  
}  

function editProduct(id) {  
  const p = products.find(x => x.id === id);  
  if(!p) return;  
  document.getElementById('pfId').value = p.id;  
  document.getElementById('pfName').value = p.name || '';  
  document.getElementById('pfCategory').value = p.category || '';  
  document.getElementById('pfPrice').value = p.price || '';  
  document.getElementById('pfImg').value = (p.images && p.images[0]) || '';  
  document.getElementById('pfTitle').textContent = 'تعديل المنتج';  
  window.scrollTo({top: 0, behavior: 'smooth'});  
}  

function resetForm() {  
  document.getElementById('pfId').value = '';  
  document.getElementById('pfName').value = '';  
  document.getElementById('pfPrice').value = '';  
  document.getElementById('pfImg').value = '';  
  document.getElementById('pfTitle').textContent = 'إضافة منتج جديد';  
}  

async function deleteProduct(id) {  
  if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;  
  const { error } = await client.from('products').delete().eq('id', id);  
  if(!error) {  
    toast('تم حذف المنتج بنجاح');  
    fetchData();  
  }  
}  

async function saveProduct() {  
  const id = document.getElementById('pfId').value;  
  const name = document.getElementById('pfName').value.trim();  
  const price = Number(document.getElementById('pfPrice').value);  
  const category = document.getElementById('pfCategory').value;  
  const img = document.getElementById('pfImg').value.trim();  

  if(!name || !price) { toast('يرجى إدخال اسم وسعر المنتج'); return; }  

  toast('جارٍ الحفظ...');  

  const productData = {  
    name,  
    price,  
    category,  
    images: img ? [img] : []  
  };  

  let error;  
  if(id) {  
    const res = await client.from('products').update(productData).eq('id', id);  
    error = res.error;  
  } else {  
    const res = await client.from('products').insert([productData]);  
    error = res.error;  
  }  

  if(!error) {  
    toast('تم الحفظ بنجاح!');  
    resetForm();  
    fetchData();  
  } else {  
    alert('فشل الحفظ من قاعدة البيانات: ' + error.message);  
  }  
}  
</script>  
</body>  
</html>
