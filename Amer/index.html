<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>لوحة التحكم | متجر عُمراء</title>  
<link rel="preconnect" href="https://fonts.googleapis.com">  
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Markazi+Text:wght@400;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">  

<style>  
  :root{  
    --cream:#F8EACB; --cream-deep:#F1DDA6; --card:#FFFBF0; --ink:#20301C;  
    --ink-soft:#3B4A34; --gold:#A9793C; --gold-soft:#C9A96E; --line:rgba(32,48,28,.16);  
    --danger:#9B3A2E; --ok:#4C6B3E; --shadow:0 10px 30px rgba(32,48,28,.10);  
  }  
  *{box-sizing:border-box;}  
  html,body{margin:0;padding:0;}  
  body{ background: var(--cream); color:var(--ink); font-family:'Tajawal',sans-serif; min-height:100vh; }  
  .btn{background:var(--ink); color:var(--cream); border:none; padding:13px; border-radius:12px; font-weight:700; font-size:15px; width:100%; cursor:pointer;}  
  .btn.secondary{background:transparent; border:1px solid var(--ink); color:var(--ink);}  
  .btn.danger{background:var(--danger); color:#fff;}  
  .btn.small{padding:8px 14px; font-size:13px; width:auto;}  
  
  .scrim{position:fixed; inset:0; background:rgba(20,26,16,.55); backdrop-filter:blur(3px); z-index:80; opacity:0; pointer-events:none; transition:.3s;}  
  .scrim.show{opacity:1; pointer-events:auto;}  
  .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:min(400px,92vw); background:var(--card); border-radius:20px; z-index:95; padding:26px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; }  
  .modal.show{opacity:1; pointer-events:auto; transform:translate(-50%,-50%);}  

  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px; font-weight:700;}  
  input[type=text],input[type=tel],input[type=number],input[type=password],input[type=color],textarea,select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit; font-size:14px; color:var(--ink); }  
  textarea{resize:vertical; min-height:70px;}  

  #adminView{display:none;}  
  .adminbar{max-width:1180px; margin:0 auto; padding:16px 22px 0; display:flex; gap:8px; flex-wrap:wrap;}  
  .adminbar button{background:var(--card); border:1px solid var(--line); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-soft);}  
  .adminbar button.active{background:var(--ink); color:var(--cream);}  
  .adminbar .spacer{flex:1;}  
  .admin-panel{max-width:1180px; margin:0 auto; padding:20px 22px 70px;}  

  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}  
  th,td{padding:10px 12px; text-align:right; font-size:13px; border-bottom:1px solid var(--line);}  
  th{background:var(--cream-deep); font-weight:800;}  
  .tbl-img{width:42px; height:42px; object-fit:cover; border-radius:8px;}  
  .form-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:26px;}  
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}  
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  
  .status-pill{font-size:11px; padding:3px 10px; border-radius:999px; font-weight:700;}  
  .status-pending{background:#F3E3B8; color:#7A5B10;}  
  .status-confirmed{background:#D6E7CC; color:var(--ok);}  
  .status-shipped{background:#CFE1F0; color:#2C5A82;}  

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:12px 22px; border-radius:999px; font-size:13px; font-weight:700; z-index:200; opacity:0; transition:.3s; pointer-events:none;}  
  .toast.show{opacity:1; bottom:34px;}  
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}  
  .actions{display:flex; gap:6px;}  
  
  .admin-cat-pill { background:var(--cream); border:1px solid var(--gold-soft); padding:6px 12px; border-radius:999px; font-size:13px; display:inline-flex; align-items:center; gap:8px; margin: 4px; }
  .admin-cat-pill button { background:none; border:none; cursor:pointer; font-weight:bold; }
  .admin-cat-pill .btn-del { color:var(--danger); }
  
  .flex-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom:12px; border-bottom:1px dashed var(--line); }
  .stat-box { background: var(--card); border: 1px solid var(--gold-soft); padding: 20px; border-radius: 16px; text-align: center; box-shadow: var(--shadow); }
  .stat-box h1 { margin: 0; font-size: 42px; color: var(--gold); }
</style>  
</head>  
<body>  
  
<div class="scrim show" id="loginScrim"></div>  
<div class="modal show" id="loginModal">  
  <div style="text-align:center; margin-bottom:10px;"><span style="font-size:30px;">عُمراء</span></div>
  <h3>دخول لوحة التحكم</h3>  
  <label>كلمة المرور</label>  
  <input type="password" id="loginPass" onkeydown="if(event.key==='Enter')adminLogin()">  
  <button class="btn" style="margin-top:14px;" onclick="adminLogin()">دخول</button>  
</div>  
  
<div id="adminView">  
  <div class="adminbar">  
    <button class="active" data-tab="dashboard" onclick="showTab('dashboard')">الإحصائيات</button>  
    <button data-tab="products" onclick="showTab('products')">المنتجات</button>  
    <button data-tab="orders" onclick="showTab('orders')">الطلبات</button>  
    <button data-tab="payment" onclick="showTab('payment')">الدفع</button>  
    <button data-tab="settings" onclick="showTab('settings')">الإعدادات والتصميم</button>  
    <div class="spacer"></div>  
    <button onclick="adminLogout()">تسجيل خروج</button>  
  </div>  
  
  <div class="admin-panel">  
    <!-- الإحصائيات -->
    <div id="tab-dashboard">
        <div class="row3">
            <div class="stat-box"><h3>عدد المنتجات</h3><h1 id="statProducts">0</h1></div>
            <div class="stat-box"><h3>الطلبات</h3><h1 id="statOrders">0</h1></div>
        </div>
    </div>

    <!-- المنتجات -->
    <div id="tab-products" style="display:none;">  
      <div class="form-card">  
        <h3 id="pfTitle" style="margin-top:0;">إضافة/تعديل منتج</h3>  
        <input type="hidden" id="pfId">  
        <div class="row2">  
          <div><label>اسم المنتج</label><input type="text" id="pfName"></div>  
          <div><label>القسم (السطر)</label><select id="pfCategory"></select></div>  
        </div>  
        <div class="row2">  
          <div><label>السعر</label><input type="number" step="0.01" id="pfPrice"></div>  
          <div><label>رابط الصورة المباشر</label><input type="text" id="pfImg" placeholder="https://..."></div>  
        </div>  
        <div style="display:flex; gap:10px; margin-top:16px;">  
          <button class="btn" onclick="saveProduct()">حفظ المنتج</button>  
          <button class="btn secondary" onclick="resetProductForm()">إلغاء</button>  
        </div>  
      </div>  
      <table>  
        <thead><tr><th>الاسم</th><th>القسم</th><th>السعر</th><th></th></tr></thead>  
        <tbody id="adminProductRows"></tbody>  
      </table>  
    </div>  
  
    <!-- الطلبات -->
    <div id="tab-orders" style="display:none;">  
      <table>  
        <thead><tr><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead>  
        <tbody id="adminOrderRows"></tbody>  
      </table>  
    </div>  
  
    <!-- طرق الدفع -->
    <div id="tab-payment" style="display:none;">  
      <div class="form-card">  
        <h3 style="margin-top:0;">بيانات التحويل البنكي</h3>  
        <label>اسم البنك</label><input type="text" id="payBankName">  
        <label>رقم الحساب</label><input type="text" id="payAccNumber">  
      </div>  
      <button class="btn" onclick="savePaymentSettings()">حفظ طرق الدفع</button>  
    </div>  
  
    <!-- الإعدادات -->
    <div id="tab-settings" style="display:none;">  
      
      <div class="form-card">
        <h3 style="margin-top:0;">تخصيص الخطوط</h3>
        <label>خط أسماء المنتجات وعناوين الأقسام</label>
        <select id="setProductFont">
          <option value="'Aref Ruqaa', serif">عارف رقعة (Aref Ruqaa) - افتراضي</option>
          <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
          <option value="'Markazi Text', serif">مركزي (Markazi Text)</option>
          <option value="'Cairo', sans-serif">كايرو (Cairo)</option>
          <option value="'Amiri', serif">أميري (Amiri)</option>
        </select>
      </div>

      <div class="form-card">
        <h3 style="margin-top:0;">إدارة الأقسام</h3>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newCategoryInput" placeholder="مثال: إبراق، دخوني...">
          <button class="btn small" onclick="addNewCategory()">إضافة</button>
        </div>
        <div id="adminCategoryList" style="margin-top:14px; display:flex; flex-wrap:wrap;"></div>
      </div>

      <div class="form-card">  
        <h3 style="margin-top:0;">حفظ الإعدادات</h3>  
        <button class="btn" onclick="saveGeneralSettings()">حفظ جميع الإعدادات</button>  
      </div>  
    </div>  
  </div>  
</div>  
  
<div class="toast" id="toast"></div>  
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>  
const SUPABASE_URL = "https://vhnvjcioxmacfsogmrka.supabase.co";  
const SUPABASE_ANON_KEY = "sb_publishable_oqvyjt2eMRXeLKS-u7ahpQ_EhmoZR2t";  
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
let products = [];  
let orders = [];  
let paymentSettings = {};  
let generalSettings = {};  
const BLOCKED_CATS = ['عطور فاخرة', 'منتجات أخرى', 'عطور فاخره'];
  
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }  
  
async function adminLogin(){  
  const pass = document.getElementById('loginPass').value;  
  const { data, error } = await client.from('settings').select('data').eq('id', 'admin').single();  
  if(!error && data && data.data && data.data.password === pass){  
    document.getElementById('loginModal').classList.remove('show');
    document.getElementById('loginScrim').classList.remove('show');
    document.getElementById('adminView').style.display='block';
    fetchProducts(); fetchSettings(); fetchOrders();
  } else { alert('كلمة المرور غير صحيحة'); }  
}  

function adminLogout(){ location.reload(); }  
function showTab(name){  
  ['dashboard','products','orders','payment','settings'].forEach(t => document.getElementById('tab-'+t).style.display = (t===name)?'block':'none');  
  document.querySelectorAll('.adminbar button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===name));  
}  
  
async function fetchProducts() {
  const { data } = await client.from('products').select('*').order('created_at', { ascending: false });
  if (data) { products = data; document.getElementById('statProducts').textContent = products.length; renderAdminProducts(); }
}
async function fetchOrders() {
  const { data } = await client.from('orders').select('*').order('created_at', { ascending: false });
  if (data) { orders = data; document.getElementById('statOrders').textContent = orders.length; renderAdminOrders(); }
}

async function fetchSettings() {
  const { data } = await client.from('settings').select('*');
  if (data) {
    const payDoc = data.find(d => d.id === 'payment');
    const genDoc = data.find(d => d.id === 'general');
    if (payDoc) { paymentSettings = payDoc.data || {}; fillPaymentForm(); }
    if (genDoc && genDoc.data) {
      generalSettings = Object.assign({}, genDoc.data);
      
      // التصفية الصارمة وحظر الأقسام القديمة
      if(generalSettings.categories) {
          generalSettings.categories = generalSettings.categories.filter(c => !BLOCKED_CATS.includes(c));
      }
      if(!generalSettings.categories || generalSettings.categories.length === 0) generalSettings.categories = ['إبراق', 'دخوني'];
      
      document.getElementById('setProductFont').value = generalSettings.productFont || "'Aref Ruqaa', serif";
      renderAdminCatList(); 
    }
  }
}

function renderAdminCatList() {
  const box = document.getElementById('adminCategoryList');
  box.innerHTML = generalSettings.categories.map((c, i) => `
    <div class="admin-cat-pill">
      <span>${c}</span>
      <button class="btn-del" onclick="removeAdminCat(${i})">✕</button>
    </div>`).join('');
  const select = document.getElementById('pfCategory');
  select.innerHTML = generalSettings.categories.map(c => `<option value="${c}">${c}</option>`).join('');
}

async function addNewCategory() {
  const v = document.getElementById('newCategoryInput').value.trim();
  if(v && !BLOCKED_CATS.includes(v) && !generalSettings.categories.includes(v)) { 
      generalSettings.categories.push(v); 
      await client.from('settings').update({ data: generalSettings }).eq('id', 'general');
      renderAdminCatList(); toast('تم إضافة القسم!');
  }
  document.getElementById('newCategoryInput').value = '';
}

async function removeAdminCat(index) { 
  if(!confirm('هل أنت متأكد من حذف القسم؟')) return;
  generalSettings.categories.splice(index, 1); 
  await client.from('settings').update({ data: generalSettings }).eq('id', 'general');
  renderAdminCatList(); toast('تم الحذف بنجاح');
}

async function saveGeneralSettings(){  
  toast('جارٍ الحفظ...');
  generalSettings.productFont = document.getElementById('setProductFont').value;
  // التصفية قبل الحفظ للتأكيد
  generalSettings.categories = generalSettings.categories.filter(c => !BLOCKED_CATS.includes(c));
  
  const { error } = await client.from('settings').update({ data: generalSettings }).eq('id', 'general');
  if (error) { alert('خطأ: ' + error.message); } else { toast('تم حفظ الإعدادات!'); }  
}  

/* ---------- المنتجات ---------- */
function resetProductForm(){  
  document.getElementById('pfId').value=''; document.getElementById('pfName').value='';  
  document.getElementById('pfPrice').value=''; document.getElementById('pfImg').value='';  
  document.getElementById('pfTitle').textContent='إضافة منتج جديد';  
}  

function editProduct(id){  
  const p = products.find(x=>x.id===id); if(!p) return;  
  document.getElementById('pfId').value=p.id; document.getElementById('pfName').value=p.name||'';  
  document.getElementById('pfCategory').value = p.category || generalSettings.categories[0]; 
  document.getElementById('pfPrice').value=p.price||'';  
  document.getElementById('pfImg').value=(p.images&&p.images[0])||'';  
  document.getElementById('pfTitle').textContent='تعديل المنتج'; window.scrollTo({top:0,behavior:'smooth'});  
}  

async function deleteProduct(id){  
  if(!confirm('حذف نهائي؟')) return;  
  await client.from('products').delete().eq('id', id); fetchProducts(); toast('تم الحذف');  
}  

async function saveProduct(){  
  const name = document.getElementById('pfName').value.trim();  
  const price = Number(document.getElementById('pfPrice').value);  
  const category = document.getElementById('pfCategory').value;
  const imgUrl = document.getElementById('pfImg').value.trim();
  if(!name || !price){ toast('يرجى تعبئة الحقول'); return; }  
  toast('جارٍ الحفظ…');  
  
  const productData = { name, category, price, images: imgUrl ? [imgUrl] : [] };  
  const id = document.getElementById('pfId').value;  
  if(id) await client.from('products').update(productData).eq('id', id); 
  else await client.from('products').insert([productData]); 
  
  resetProductForm(); fetchProducts(); toast('تم حفظ المنتج بنجاح');  
}  

function renderAdminProducts(){  
  document.getElementById('adminProductRows').innerHTML = products.map(p=>`  
    <tr>  
      <td>${p.name}</td><td><b>${p.category||'—'}</b></td>  
      <td style="direction:ltr;">${Number(p.price||0).toFixed(2)}</td>  
      <td class="actions">  
        <button class="icon-btn" onclick="editProduct('${p.id}')">تعديل</button>  
        <button class="icon-btn danger" onclick="deleteProduct('${p.id}')">حذف</button>  
      </td>  
    </tr>`).join('');  
}  
  
/* ---------- الطلبات ---------- */
function renderAdminOrders(){  
  document.getElementById('adminOrderRows').innerHTML = orders.map(o=>`<tr><td>${o.name}</td><td>${o.phone}</td><td style="direction:ltr;">${o.total||'0'}</td><td>${o.status}</td><td><select onchange="updateOrderStatus('${o.id}',this.value)"><option value="pending" ${o.status==='pending'?'selected':''}>انتظار</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>مؤكد</option></select></td></tr>`).join('');  
}  
async function updateOrderStatus(id,status){ await client.from('orders').update({status}).eq('id', id); toast('تم تحديث الطلب'); }  

/* ---------- الدفع ---------- */
function fillPaymentForm(){  
  document.getElementById('payBankName').value = paymentSettings.bankName||'';  
  document.getElementById('payAccNumber').value = paymentSettings.accNumber||'';  
}  
async function savePaymentSettings(){  
  const data = { bankName: document.getElementById('payBankName').value, accNumber: document.getElementById('payAccNumber').value };  
  await client.from('settings').update({ data }).eq('id', 'payment'); toast('تم الحفظ');  
}  
</script>  
</body>  
</html>
